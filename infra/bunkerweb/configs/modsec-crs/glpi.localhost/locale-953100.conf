# Ruta: GET /front/locale.php (sitio glpi.localhost)
# Regla: 953100 (PHP Information Leakage, RESPONSE-953-DATA-LEAKAGES-PHP)
# Motivo: la respuesta es el catalogo de traducciones de GLPI en JSON (~400 KB) e incluye frases como
#   las de los mensajes de error de PHP. La 953100 las marca, la 959100 corta la respuesta ya enviada
#   y el navegador recibe 500 (GLPI respondio 200). Solo se quita esa regla y solo en esa ruta; el
#   resto del CRS de entrada y de salida sigue activo (B-39, invariante 14). Probado con
#   auditoria/scripts/verificar-w01.sh y infra/waf/pruebas.sh glpi.localhost.
SecRule REQUEST_FILENAME "@streq /front/locale.php"   "id:1000101,phase:1,pass,nolog,ctl:ruleRemoveById=953100"
