# Despliegue de referencia (ADR-031): la base de la aplicacion es este PostgreSQL local
# (docs/probar-localmente.md, docs/operacion.md §3):
#
#   JML_MODO=local infra/scripts/preparar-entorno.sh
#   docker compose -f infra/compose.yaml -f infra/compose.local.yaml up -d --build
#   docker compose -f infra/compose.yaml -f infra/compose.local.yaml run --rm migrar
#   docker compose -f infra/compose.yaml -f infra/compose.local.yaml exec web python manage.py semillas
#
# Agrega la base: PostgreSQL 17 (la version mayor de Supabase) en una red interna, con los
# roles y el duenio separado (ADR-028). Lo demas viene de compose.yaml: BunkerWeb delante,
# unico servicio con puertos (invariante 14). El inicio de sesion sigue en Supabase Auth.
# El worker esta en el perfil `glpi`: arranca despues de preparar GLPI (docs/probar-localmente.md).

x-base-local: &base-local
  JML_DB_HOST: postgres
  JML_DB_SSLMODE: disable  # red interna pg_net del mismo host, sin puertos publicados (ADR-031)

services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "7" }  # RNF-16, S-36
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_local_password
    secrets: [postgres_local_password, db_password, db_owner_password]
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./local/initdb/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      # fuera de initdb.d: la imagen ejecutaria el .sql por su cuenta, sin la clave
      - ./supabase/duenio-separado.sql:/opt/jml/duenio-separado.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 10
    mem_limit: 512m
    networks: [pg_net]

  web:
    environment:
      <<: *base-local
      JML_DB_USUARIO: app_backend
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app, pg_net]

  worker:
    # Arranca solo cuando GLPI tenga su API habilitada y los tokens esten en secrets/ (3.1):
    #   docker compose ... --profile glpi up -d worker
    profiles: [glpi]
    environment:
      <<: *base-local
      JML_DB_USUARIO: app_backend
    networks: [app, pg_net]

  migrar:
    environment:
      <<: *base-local
      JML_DB_USUARIO: app_owner
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app, pg_net]

  admin-usuarios:
    environment:
      <<: *base-local
      JML_DB_USUARIO: app_backend
    networks: [app, pg_net]

secrets:
  postgres_local_password: { file: ../secrets/postgres_local_password }

volumes:
  postgres-datos:

networks:
  pg_net:
    internal: true
