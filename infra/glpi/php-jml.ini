; PHP de GLPI para JML. El soporte de vinculacion puede pesar 20 MB (RF-39, RS-17): la imagen de GLPI
; trae limites de pocos MB y el worker recibia 413 al subirlo (spike 0.3). Los limites escalan igual
; que en BunkerWeb (21m) y en Django (20 MB): un PDF valido para la aplicacion lo es para GLPI.
upload_max_filesize = 21M
post_max_size = 22M
memory_limit = 256M
