# Reporteria del WAF (RNF-16, ADR-023): recibe los logs de bunkerweb y bw-scheduler por el driver
# `fluentd` de Docker, los clasifica (clasificar.lua: waf, proteccion, acceso, sistema) y los envia
# a Loki. Reutilizado de waf-stack.

[SERVICE]
    Flush         1
    Log_Level     info

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    # Con Loki caido, retiene hasta 32 MB y pausa la entrada: Docker descarta lo que no cabe
    # (fluentd-async), BunkerWeb nunca se bloquea por la reporteria.
    Mem_Buf_Limit 32MB

[FILTER]
    Name          lua
    Match         docker.*
    Script        /fluent-bit/etc/clasificar.lua
    Call          clasificar

[OUTPUT]
    Name             loki
    Match            docker.*
    Host             loki
    Port             3100
    Labels           job=waf, origen=jml
    Label_keys       $contenedor,$tipo
    Remove_keys      contenedor,tipo
    Line_format      json
    Drop_single_key  raw
    Retry_Limit      False
