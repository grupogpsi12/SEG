[project]
name = "jml"
version = "0.1.0"
description = "Sistema integrado de eventos laborales (JML) — núcleo"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-timeout",
    "hypothesis",
    "mutmut<3",
    "ruff",
    "mypy",
    "django-stubs>=5.2,<5.3",
    "import-linter",
    "pyyaml>=6,<7",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integracion necesita PostgreSQL y GLPI reales: se corre explicitamente (ver su ajustes.py)
norecursedirs = ["integracion", ".*", "*.egg-info"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
DJANGO_SETTINGS_MODULE = "tests.adaptadores.ajustes"

[tool.coverage.run]
branch = true
source = ["jml"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "UP040", "UP047"]  # UP040/UP047: mutmut 2 no entiende PEP 695

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
namespace_packages = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.adaptadores.ajustes"

[tool.importlinter]
root_packages = ["jml", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "dominio solo importa la biblioteca estandar (CA-17)"
type = "forbidden"
source_modules = ["jml.dominio"]
forbidden_modules = [
    "jml.aplicacion", "jml.adaptadores", "config", "django", "httpx", "psycopg", "requests",
]

[[tool.importlinter.contracts]]
name = "aplicacion solo importa dominio (CA-17)"
type = "forbidden"
source_modules = ["jml.aplicacion"]
forbidden_modules = ["jml.adaptadores", "config", "django", "httpx", "psycopg", "requests"]

[[tool.importlinter.contracts]]
name = "capas del nucleo"
type = "layers"
layers = ["config", "jml.adaptadores", "jml.aplicacion", "jml.dominio"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Modelos y migraciones de Django: atributos de clase mutables y lineas generadas son el idioma.
"src/jml/adaptadores/salida/persistencia/**" = ["RUF012", "E501"]
